<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Online Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MathJax Configuration untuk Render Equation LaTeX ($...$) -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
  <style>
    img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 0.5rem 0; display: inline-block; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased select-none">

  <!-- Halaman Login Siswa -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-black text-indigo-700 tracking-tight">CBT ONLINE SEKOLAH</h2>
        <p class="text-xs text-slate-500 mt-1">Sistem Ujian Terintegrasi Google Spreadsheet</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nomor Induk Siswa (NISN)</label>
          <input type="text" id="nisn" class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Masukkan NISN Anda">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Token Ujian</label>
          <input type="text" id="token" class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm font-mono tracking-widest uppercase focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Diberikan Proktor / Pengawas">
        </div>

        <button onclick="prosesLogin()" id="btnMulai" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md hover:shadow-lg transition-all text-xs tracking-wider uppercase mt-2">
          Masuk & Mulai Mengerjakan
        </button>
      </div>
    </div>
  </div>

  <!-- Area Pengerjaan CBT -->
  <div id="cbtSection" class="hidden min-h-screen flex flex-col">
    <!-- Header CBT -->
    <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex justify-between items-center sticky top-0 z-10 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-indigo-100 text-indigo-700 font-bold rounded-full flex items-center justify-center text-sm" id="avatarInitial">
          S
        </div>
        <div>
          <h3 id="displayNama" class="font-bold text-slate-800 text-sm leading-tight"></h3>
          <p id="displayKelas" class="text-xs text-slate-500"></p>
        </div>
      </div>
      <div class="text-right">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Sisa Waktu</span>
        <div id="timer" class="text-lg font-mono font-bold text-rose-600">00:00:00</div>
      </div>
    </header>

    <!-- Konten Soal & Lembar Jawaban -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
      
      <!-- Box Soal -->
      <div class="lg:col-span-3 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
            <span id="soalHeader" class="font-extrabold text-indigo-700 text-base">Soal No 1</span>
            <span id="tipeBadge" class="text-xs font-bold px-3 py-1 rounded-full bg-indigo-50 text-indigo-700">PG</span>
          </div>

          <div id="soalContainer" class="text-slate-800 text-base leading-relaxed mb-6"></div>
          <div id="opsiContainer" class="space-y-3 mb-6"></div>
        </div>

        <!-- Tombol Navigasi Bawah -->
        <div class="flex justify-between items-center pt-4 border-t border-slate-100">
          <button onclick="prevSoal()" id="btnPrev" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition-all">← Sebelumnya</button>
          <button onclick="nextSoal()" id="btnNext" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-all">Selanjutnya →</button>
        </div>
      </div>

      <!-- Panel Navigasi Nomor -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Nomor Soal</h4>
        <div id="navGrid" class="grid grid-cols-5 gap-2 max-h-72 overflow-y-auto pr-1"></div>

        <div class="mt-6 pt-4 border-t border-slate-100">
          <button onclick="konfirmasiSelesai()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider shadow-sm transition-all">
            Kirim Lembar Jawaban
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzpp9BRwGlf0By_LJJARjuTrVAdpPcrY5vnVgj6jI55cn1mPSXWzMV050eBGIhGjp-/exec";

    let bankSoal = [];
    let userAnswers = {};
    let currentIndex = 0;
    let timerInterval = null;
    let timeRemainingSeconds = 0;
    let pesertaAktif = null;

    async function prosesLogin() {
      const nisn = document.getElementById("nisn").value.trim();
      const token = document.getElementById("token").value.trim().toUpperCase();

      if (!nisn || !token) return alert("Mohon isi NISN dan Token Ujian!");

      const btn = document.getElementById("btnMulai");
      btn.innerText = "Memverifikasi Peserta...";
      btn.disabled = true;

      try {
        // 1. Verifikasi Siswa & Token ke Google Apps Script
        const resAuth = await fetch(`${API_URL}?action=loginSiswa&nisn=${encodeURIComponent(nisn)}&token=${encodeURIComponent(token)}`);
        const authData = await resAuth.json();

        if (authData.status !== "success") {
          alert(authData.message);
          return;
        }

        pesertaAktif = authData.data;

        // 2. Mengambil Bank Soal
        btn.innerText = "Mengambil Soal...";
        const resSoal = await fetch(`${API_URL}?action=getSoal`);
        const jsonSoal = await resSoal.json();

        if (jsonSoal.status !== "success" || !jsonSoal.data || jsonSoal.data.length === 0) {
          return alert("Bank soal belum siap atau kosong.");
        }

        bankSoal = jsonSoal.data;

        // 3. Masuk ke Layar Ujian
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("cbtSection").classList.remove("hidden");
        document.getElementById("displayNama").innerText = pesertaAktif.nama;
        document.getElementById("displayKelas").innerText = `${pesertaAktif.nisn} - ${pesertaAktif.kelas}`;
        document.getElementById("avatarInitial").innerText = pesertaAktif.nama.charAt(0).toUpperCase();

        timeRemainingSeconds = (parseInt(pesertaAktif.durasi) || 90) * 60;
        startTimer();
        renderNavigasi();
        loadSoal(0);

      } catch (e) {
        alert("Koneksi gagal: " + e);
      } finally {
        btn.innerText = "Masuk & Mulai Mengerjakan";
        btn.disabled = false;
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        if (timeRemainingSeconds <= 0) {
          clearInterval(timerInterval);
          alert("Waktu pengerjaan telah habis! Jawaban Anda akan otomatis terkirim.");
          kirimDataJawaban();
          return;
        }
        timeRemainingSeconds--;
        const hours = String(Math.floor(timeRemainingSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((timeRemainingSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(timeRemainingSeconds % 60).padStart(2, '0');
        document.getElementById("timer").innerText = `${hours}:${mins}:${secs}`;
      }, 1000);
    }

    function renderNavigasi() {
      const grid = document.getElementById("navGrid");
      grid.innerHTML = "";
      bankSoal.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.id = `nav-${idx}`;
        btn.innerText = idx + 1;
        btn.className = getNavClass(idx);
        btn.onclick = () => loadSoal(idx);
        grid.appendChild(btn);
      });
    }

    function getNavClass(idx) {
      const isAnswered = userAnswers[idx] !== undefined && userAnswers[idx] !== "" && (!Array.isArray(userAnswers[idx]) || userAnswers[idx].length > 0);
      const isCurrent = idx === currentIndex;
      if (isCurrent) return "p-2.5 text-xs font-bold rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-700";
      if (isAnswered) return "p-2.5 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-sm";
      return "p-2.5 text-xs font-bold rounded-lg bg-slate-50 text-slate-700 border border-slate-200 hover:bg-slate-100";
    }

    function loadSoal(index) {
      currentIndex = index;
      const s = bankSoal[index];
      
      document.getElementById("soalHeader").innerText = `Soal No ${index + 1} dari ${bankSoal.length}`;
      document.getElementById("tipeBadge").innerText = s.tipe;
      document.getElementById("soalContainer").innerHTML = s.pertanyaan;

      renderNavigasi();

      const opsiDiv = document.getElementById("opsiContainer");
      opsiDiv.innerHTML = "";

      // Render Pilihan Ganda & Benar-Salah
      if (s.tipe === "PG" || s.tipe === "BS") {
        ['a', 'b', 'c', 'd', 'e'].forEach(opt => {
          if (!s[`opsi_${opt}`]) return;
          const label = document.createElement("label");
          label.className = `flex items-start gap-3 p-3.5 border rounded-xl hover:bg-indigo-50/50 cursor-pointer transition-all ${userAnswers[index] === opt.toUpperCase() ? 'border-indigo-600 bg-indigo-50/30' : 'border-slate-200'}`;
          label.innerHTML = `
            <input type="radio" name="jawaban_${index}" value="${opt.toUpperCase()}" ${userAnswers[index] === opt.toUpperCase() ? 'checked' : ''} onchange="pilihJawaban('${opt.toUpperCase()}')" class="mt-1 text-indigo-600 focus:ring-indigo-500">
            <span class="text-sm font-bold text-slate-800">${opt.toUpperCase()}.</span>
            <div class="text-sm text-slate-700">${s[`opsi_${opt}`]}</div>
          `;
          opsiDiv.appendChild(label);
        });
      } 
      // Render Pilihan Ganda Kompleks (PGK)
      else if (s.tipe === "PGK") {
        ['a', 'b', 'c', 'd', 'e'].forEach(opt => {
          if (!s[`opsi_${opt}`]) return;
          const currentArr = userAnswers[index] || [];
          const isChecked = currentArr.includes(opt.toUpperCase());
          const label = document.createElement("label");
          label.className = `flex items-start gap-3 p-3.5 border rounded-xl hover:bg-indigo-50/50 cursor-pointer transition-all ${isChecked ? 'border-indigo-600 bg-indigo-50/30' : 'border-slate-200'}`;
          label.innerHTML = `
            <input type="checkbox" value="${opt.toUpperCase()}" ${isChecked ? 'checked' : ''} onchange="pilihPGK('${opt.toUpperCase()}')" class="mt-1 rounded text-indigo-600 focus:ring-indigo-500">
            <span class="text-sm font-bold text-slate-800">${opt.toUpperCase()}.</span>
            <div class="text-sm text-slate-700">${s[`opsi_${opt}`]}</div>
          `;
          opsiDiv.appendChild(label);
        });
      } 
      // Render Menjodohkan / Essay
      else {
        const textarea = document.createElement("textarea");
        textarea.className = "w-full border border-slate-300 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none";
        textarea.rows = 4;
        textarea.placeholder = "Tuliskan jawaban Anda di sini...";
        textarea.value = userAnswers[index] || "";
        textarea.oninput = (e) => { 
          userAnswers[index] = e.target.value; 
          renderNavigasi();
        };
        opsiDiv.appendChild(textarea);
      }

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    function pilihJawaban(val) {
      userAnswers[currentIndex] = val;
      loadSoal(currentIndex);
    }

    function pilihPGK(val) {
      let arr = userAnswers[currentIndex] || [];
      if (arr.includes(val)) {
        arr = arr.filter(x => x !== val);
      } else {
        arr.push(val);
      }
      userAnswers[currentIndex] = arr.sort();
      loadSoal(currentIndex);
    }

    function prevSoal() {
      if (currentIndex > 0) loadSoal(currentIndex - 1);
    }

    function nextSoal() {
      if (currentIndex < bankSoal.length - 1) loadSoal(currentIndex + 1);
    }

    function konfirmasiSelesai() {
      const totalTerjawab = Object.keys(userAnswers).filter(k => userAnswers[k] && userAnswers[k].length > 0).length;
      const konfirmasi = confirm(`Anda telah menjawab ${totalTerjawab} dari ${bankSoal.length} soal.\n\nApakah Anda yakin ingin menyelesaikan dan mengirim jawaban?`);
      if (konfirmasi) {
        kirimDataJawaban();
      }
    }

    async function kirimDataJawaban() {
      let score = 0;
      bankSoal.forEach((s, idx) => {
        const ans = userAnswers[idx];
        if (s.tipe === "PG" || s.tipe === "BS") {
          if (ans === s.kunci) score += 2.5;
        } else if (s.tipe === "PGK") {
          if (Array.isArray(ans) && ans.join(", ") === s.kunci) score += 2.5;
        }
      });

      const payload = {
        action: "submitUjian",
        nisn: pesertaAktif.nisn,
        nama: pesertaAktif.nama,
        kelas: pesertaAktif.kelas,
        nilai: score,
        detailJawaban: userAnswers
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        clearInterval(timerInterval);
        alert(`Ujian Selesai!\n\nNama: ${payload.nama}\nNilai Pilihan Ganda: ${score}`);
        location.reload();
      } catch (e) {
        alert("Terjadi masalah saat mengirim jawaban, coba lagi: " + e);
      }
    }
  </script>
</body>
</html>
