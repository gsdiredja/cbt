<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin CBT - Import Bank Soal Word</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Mammoth JS untuk mengekstrak teks, formula, dan gambar Base64 dari DOCX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-md border border-slate-200">
    <div class="border-b pb-4 mb-6">
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">Panel Guru: Import Bank Soal Word (.docx)</h1>
      <p class="text-xs text-slate-500 mt-1">Mendukung otomatis gambar/bagan, rumus LaTeX ($...$), dan 5 tipe soal: [BS], [PG], [PGK], [JODOH], [ESSAY].</p>
    </div>

    <!-- Status Endpoint -->
    <div class="mb-6 p-4 bg-indigo-50 border border-indigo-200 rounded-xl flex items-center justify-between">
      <div>
        <p class="text-[10px] font-bold text-indigo-700 uppercase tracking-wider">Backend Apps Script Endpoint:</p>
        <p class="text-xs text-indigo-950 font-mono break-all mt-0.5" id="endpointDisplay"></p>
      </div>
      <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
        ● Siap Terhubung
      </span>
    </div>

    <!-- Upload Box Area -->
    <div class="mb-8">
      <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Pilih File Dokumen Soal:</label>
      <div class="border-2 border-dashed border-slate-300 hover:border-indigo-500 bg-slate-50 hover:bg-indigo-50/20 transition-all rounded-xl p-8 text-center cursor-pointer" onclick="document.getElementById('wordFile').click()">
        <svg class="w-12 h-12 text-slate-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <input type="file" id="wordFile" accept=".docx" class="hidden" onchange="handleFile(this)">
        <span class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow-sm">Pilih File .docx</span>
        <p id="fileName" class="text-xs text-slate-500 mt-3 font-medium">Belum ada file dipilih</p>
      </div>
    </div>

    <!-- Preview Container -->
    <div id="previewContainer" class="hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4 pb-3 border-b">
        <div>
          <h2 class="font-bold text-lg text-slate-800">Pratinjau Hasil Ekstraksi</h2>
          <p class="text-xs text-slate-500">Terdeteksi: <span id="totalSoal" class="font-bold text-indigo-600">0</span> butir soal</p>
        </div>
        <button onclick="uploadToSheets()" id="btnUpload" class="w-full sm:w-auto px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm transition-all text-xs">
          Simpan ke Google Sheets
        </button>
      </div>

      <div id="previewList" class="space-y-4 max-h-[500px] overflow-y-auto border border-slate-200 p-4 rounded-xl bg-slate-50"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzpp9BRwGlf0By_LJJARjuTrVAdpPcrY5vnVgj6jI55cn1mPSXWzMV050eBGIhGjp-/exec";
    document.getElementById("endpointDisplay").innerText = API_URL;

    let parsedQuestions = [];

    async function handleFile(input) {
      const file = input.files[0];
      if (!file) return;
      document.getElementById("fileName").innerText = `File: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

      const reader = new FileReader();
      reader.onload = function(event) {
        const arrayBuffer = event.target.result;
        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
          .then(displayResult)
          .catch(err => alert("Gagal memproses dokumen Word: " + err));
      };
      reader.readAsArrayBuffer(file);
    }

    function displayResult(result) {
      const rawHtml = result.value;
      const rawBlocks = rawHtml.split(/(?=\d+\.\s*\[(?:BS|PG|PGK|JODOH|ESSAY)\])/gi);
      
      parsedQuestions = [];
      const previewList = document.getElementById("previewList");
      previewList.innerHTML = "";

      rawBlocks.forEach((block) => {
        if (!block.trim()) return;
        
        const matchType = block.match(/(\d+)\.\s*\[(BS|PG|PGK|JODOH|ESSAY)\]/i);
        if (!matchType) return;

        const no = matchType[1];
        const tipe = matchType[2].toUpperCase();

        let kunci = "";
        const matchKunci = block.match(/KUNCI:\s*([^<]+)/i);
        if (matchKunci) kunci = matchKunci[1].trim();

        let cleanBlock = block.replace(/KUNCI:\s*[^<]+/i, "");
        let opsi_a = "", opsi_b = "", opsi_c = "", opsi_d = "", opsi_e = "";

        if (tipe === "PG" || tipe === "PGK" || tipe === "BS") {
          const parts = cleanBlock.split(/(?=[A-E]\.\s*)/g);
          const qText = parts[0].replace(/^\d+\.\s*\[[^\]]+\]\s*/i, "").trim();

          parts.forEach(p => {
            if (/^A\.\s*/i.test(p)) opsi_a = p.replace(/^A\.\s*/i, "").trim();
            if (/^B\.\s*/i.test(p)) opsi_b = p.replace(/^B\.\s*/i, "").trim();
            if (/^C\.\s*/i.test(p)) opsi_c = p.replace(/^C\.\s*/i, "").trim();
            if (/^D\.\s*/i.test(p)) opsi_d = p.replace(/^D\.\s*/i, "").trim();
            if (/^E\.\s*/i.test(p)) opsi_e = p.replace(/^E\.\s*/i, "").trim();
          });

          parsedQuestions.push({ no, tipe, pertanyaan: qText, opsi_a, opsi_b, opsi_c, opsi_d, opsi_e, kunci });
        } else {
          const qText = cleanBlock.replace(/^\d+\.\s*\[[^\]]+\]\s*/i, "").trim();
          parsedQuestions.push({ no, tipe, pertanyaan: qText, opsi_a: "", opsi_b: "", opsi_c: "", opsi_d: "", opsi_e: "", kunci });
        }
      });

      document.getElementById("totalSoal").innerText = parsedQuestions.length;
      document.getElementById("previewContainer").classList.remove("hidden");

      parsedQuestions.forEach(q => {
        const div = document.createElement("div");
        div.className = "p-4 bg-white border border-slate-200 rounded-lg shadow-sm text-sm";
        div.innerHTML = `
          <div class="flex items-center gap-2 mb-2">
            <span class="font-bold text-slate-800">Nomor ${q.no}</span>
            <span class="px-2 py-0.5 rounded text-xs font-semibold bg-slate-100 text-slate-700">${q.tipe}</span>
          </div>
          <div class="text-slate-700 leading-relaxed mb-3">${q.pertanyaan}</div>
          ${q.opsi_a ? `<div class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded mb-2 space-y-1">
            <div><strong>A:</strong> ${q.opsi_a}</div>
            <div><strong>B:</strong> ${q.opsi_b}</div>
            ${q.opsi_c ? `<div><strong>C:</strong> ${q.opsi_c}</div>` : ''}
            ${q.opsi_d ? `<div><strong>D:</strong> ${q.opsi_d}</div>` : ''}
            ${q.opsi_e ? `<div><strong>E:</strong> ${q.opsi_e}</div>` : ''}
          </div>` : ''}
          <div class="text-xs font-medium text-slate-500">Kunci: <span class="font-bold text-emerald-600">${q.kunci || '-'}</span></div>
        `;
        previewList.appendChild(div);
      });
    }

    async function uploadToSheets() {
      if (parsedQuestions.length === 0) return alert("Belum ada butir soal yang terbaca!");

      const btn = document.getElementById("btnUpload");
      btn.innerText = "Menyimpan ke Spreadsheet...";
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "saveBankSoal", soalList: parsedQuestions })
        });
        const result = await res.json();
        if (result.status === "success") {
          alert("Sukses: " + (result.message || "Bank soal berhasil diunggah!"));
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (e) {
        alert("Terjadi masalah jaringan: " + e);
      } finally {
        btn.innerText = "Simpan ke Google Sheets";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
