<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Online Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MathJax untuk Render Equation LaTeX ($...$) -->
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- Halaman Login -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg">
      <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">UJIAN BERBASIS KOMPUTER</h2>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-600">NISN</label>
          <input type="text" id="nisn" class="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-indigo-500" placeholder="Masukkan NISN">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Nama Lengkap</label>
          <input type="text" id="nama" class="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-indigo-500" placeholder="Nama Anda">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Kelas</label>
          <input type="text" id="kelas" class="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-indigo-500" placeholder="Contoh: XII-IPA 1">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">URL Endpoint CBT</label>
          <input type="text" id="cbtApi" class="w-full border rounded-lg p-2.5 mt-1 text-xs" placeholder="URL Web App Google Apps Script">
        </div>
        <button onclick="mulaiUjian()" id="btnMulai" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow mt-2">Mulai Ujian</button>
      </div>
    </div>
  </div>

  <!-- Area Pengerjaan CBT -->
  <div id="cbtSection" class="hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b px-6 py-3 flex justify-between items-center shadow-sm">
      <div>
        <h3 id="displayNama" class="font-bold text-slate-800"></h3>
        <p id="displayKelas" class="text-xs text-slate-500"></p>
      </div>
      <div class="text-right">
        <span class="text-xs text-slate-400">Sisa Waktu</span>
        <div id="timer" class="text-xl font-bold text-rose-600">00:00:00</div>
      </div>
    </header>

    <!-- Konten Soal & Navigasi -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-4 gap-6">
      <div class="md:col-span-3 bg-white p-6 rounded-xl shadow-sm">
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
          <span id="soalHeader" class="font-bold text-indigo-600">Soal No 1</span>
          <span id="tipeBadge" class="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded">PG</span>
        </div>
        <div id="soalContainer" class="text-base leading-relaxed mb-6"></div>
        <div id="opsiContainer" class="space-y-3"></div>
      </div>

      <!-- Nomor Navigasi -->
      <div class="bg-white p-4 rounded-xl shadow-sm h-fit">
        <h4 class="text-xs font-bold text-slate-500 uppercase mb-3">Navigasi Soal</h4>
        <div id="navGrid" class="grid grid-cols-5 gap-2"></div>
        <button onclick="konfirmasiSelesai()" class="w-full mt-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm">Kirim Jawaban</button>
      </div>
    </main>
  </div>

  <script>
    let bankSoal = [];
    let userAnswers = {};
    let currentIndex = 0;
    let apiUrl = "";

    async function mulaiUjian() {
      const nisn = document.getElementById("nisn").value.trim();
      const nama = document.getElementById("nama").value.trim();
      const kelas = document.getElementById("kelas").value.trim();
      apiUrl = document.getElementById("cbtApi").value.trim();

      if (!nisn || !nama || !apiUrl) return alert("Lengkapi data login!");

      const btn = document.getElementById("btnMulai");
      btn.innerText = "Memuat Soal...";
      btn.disabled = true;

      try {
        const res = await fetch(`${apiUrl}?action=getSoal`);
        const json = await res.json();
        if (json.status !== "success" || json.data.length === 0) return alert("Bank soal kosong atau gagal dimuat.");

        bankSoal = json.data;
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("cbtSection").classList.remove("hidden");
        document.getElementById("displayNama").innerText = nama;
        document.getElementById("displayKelas").innerText = kelas;

        renderNavigasi();
        loadSoal(0);
      } catch (e) {
        alert("Gagal koneksi: " + e);
      } finally {
        btn.innerText = "Mulai Ujian";
        btn.disabled = false;
      }
    }

    function renderNavigasi() {
      const grid = document.getElementById("navGrid");
      grid.innerHTML = "";
      bankSoal.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.id = `nav-${idx}`;
        btn.innerText = idx + 1;
        btn.className = `p-2 text-xs font-bold rounded border ${userAnswers[idx] ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-700'}`;
        btn.onclick = () => loadSoal(idx);
        grid.appendChild(btn);
      });
    }

    function loadSoal(index) {
      currentIndex = index;
      const s = bankSoal[index];
      document.getElementById("soalHeader").innerText = `Soal No ${index + 1}`;
      document.getElementById("tipeBadge").innerText = s.tipe;
      document.getElementById("soalContainer").innerHTML = s.pertanyaan;

      const opsiDiv = document.getElementById("opsiContainer");
      opsiDiv.innerHTML = "";

      if (s.tipe === "PG" || s.tipe === "BS") {
        ['a', 'b', 'c', 'd', 'e'].forEach(opt => {
          if (!s[`opsi_${opt}`]) return;
          const label = document.createElement("label");
          label.className = "flex items-start gap-3 p-3 border rounded-lg hover:bg-slate-50 cursor-pointer";
          label.innerHTML = `
            <input type="radio" name="jawaban" value="${opt.toUpperCase()}" ${userAnswers[index] === opt.toUpperCase() ? 'checked' : ''} onchange="pilihJawaban('${opt.toUpperCase()}')" class="mt-1">
            <span class="text-sm font-semibold">${opt.toUpperCase()}.</span>
            <div class="text-sm">${s[`opsi_${opt}`]}</div>
          `;
          opsiDiv.appendChild(label);
        });
      } else if (s.tipe === "PGK") {
        ['a', 'b', 'c', 'd', 'e'].forEach(opt => {
          if (!s[`opsi_${opt}`]) return;
          const currentArr = userAnswers[index] || [];
          const label = document.createElement("label");
          label.className = "flex items-start gap-3 p-3 border rounded-lg hover:bg-slate-50 cursor-pointer";
          label.innerHTML = `
            <input type="checkbox" value="${opt.toUpperCase()}" ${currentArr.includes(opt.toUpperCase()) ? 'checked' : ''} onchange="pilihPGK('${opt.toUpperCase()}')" class="mt-1">
            <span class="text-sm font-semibold">${opt.toUpperCase()}.</span>
            <div class="text-sm">${s[`opsi_${opt}`]}</div>
          `;
          opsiDiv.appendChild(label);
        });
      } else {
        // Essay / Jodoh
        const textarea = document.createElement("textarea");
        textarea.className = "w-full border rounded-lg p-3 text-sm";
        textarea.rows = 4;
        textarea.placeholder = "Tuliskan jawaban Anda di sini...";
        textarea.value = userAnswers[index] || "";
        textarea.oninput = (e) => { userAnswers[index] = e.target.value; updateNavColor(); };
        opsiDiv.appendChild(textarea);
      }

      if (window.MathJax) MathJax.typesetPromise();
    }

    function pilihJawaban(val) {
      userAnswers[currentIndex] = val;
      updateNavColor();
    }

    function pilihPGK(val) {
      let arr = userAnswers[currentIndex] || [];
      if (arr.includes(val)) arr = arr.filter(x => x !== val);
      else arr.push(val);
      userAnswers[currentIndex] = arr.sort();
      updateNavColor();
    }

    function updateNavColor() {
      const btn = document.getElementById(`nav-${currentIndex}`);
      if (userAnswers[currentIndex] && userAnswers[currentIndex].length > 0) {
        btn.className = "p-2 text-xs font-bold rounded border bg-indigo-600 text-white";
      }
    }

    async function konfirmasiSelesai() {
      if (!confirm("Apakah Anda yakin ingin menyelesaikan dan mengirim ujian?")) return;

      // Hitung skor sederhana (PG & BS)
      let score = 0;
      bankSoal.forEach((s, idx) => {
        const ans = userAnswers[idx];
        if (s.tipe === "PG" || s.tipe === "BS") {
          if (ans === s.kunci) score += 2.5; // skala contoh
        } else if (s.tipe === "PGK") {
          if (Array.isArray(ans) && ans.join(", ") === s.kunci) score += 2.5;
        }
      });

      const payload = {
        action: "submitUjian",
        nisn: document.getElementById("nisn").value.trim(),
        nama: document.getElementById("nama").value.trim(),
        kelas: document.getElementById("kelas").value.trim(),
        nilai: score,
        detailJawaban: userAnswers
      };

      try {
        await fetch(apiUrl, { method: "POST", body: JSON.stringify(payload) });
        alert(`Ujian Selesai! Jawaban Anda telah tersimpan ke sistem.`);
        location.reload();
      } catch (e) {
        alert("Gagal mengirim jawaban, coba lagi: " + e);
      }
    }
  </script>
</body>
</html>
